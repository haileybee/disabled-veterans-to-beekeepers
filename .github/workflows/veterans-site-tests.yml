name: Veterans Site Tests

on:
  push:
    branches:
      - feature/community-store-admin
      - fix/connect-dedicated-veterans-chat
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run contract tests
        run: npm test

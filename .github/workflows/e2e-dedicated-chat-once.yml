name: One-time Dedicated Veterans Chat E2E
on:
  push:
    branches: [fix/connect-dedicated-veterans-chat]
    paths: ['.github/workflows/e2e-dedicated-chat-once.yml']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send and read a real veterans chat message
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://qnwhxcbjukzzrjoykpau.supabase.co'
          KEY='sb_publishable_3Pwkxlqqx0nFDDZg_fTmsQ_tFJrRZo7'
          GUEST=$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          MARKER="Dedicated veterans chat E2E $(date +%s)"
          RESP=$(curl -fsS -X POST "$BASE/functions/v1/veterans-chat-post" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://haileybee.github.io' \
            --data "{\"guestId\":\"$GUEST\",\"displayName\":\"Chat Test\",\"body\":\"$MARKER\",\"imageDataUrl\":null}")
          echo "$RESP" | grep -q '"message"'
          READ=$(curl -fsS "$BASE/rest/v1/veterans_chat_messages?display_name=eq.Chat%20Test&body=eq.$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$MARKER")&select=id,body" \
            -H "apikey: $KEY")
          echo "$READ" | grep -Fq "$MARKER"
          echo 'DEDICATED_VETERANS_CHAT_E2E_PASS'
